<style>

* {

}


html,
body {

/******************************************************

    5px;

}


.brand-text {

  display: flex;

}


.brand-name {

  font-size:

  font-weight:
    900;

}


.brand-subtitle {

.kiosk-label {

.main {

/******************************************************

.waiting {

  display: flex;

.waiting-title {

.employee-photo {

.employee-name {

.employee-id {

}


/******************************************************
 * ACTION
 ******************************************************/

.action {

  margin-top:
    22px;

  padding:
    14px 45px;

  border-radius:
    50px;

  font-size:

    );

    900;

    2px;

}


.action.time-in {

}


.action.time-out {

/******************************************************
 * DATE TIME
 ******************************************************/

.date-time {

  margin-top:

  display:

    column;

  align-items:

}


.date {

  font-size:

  font-weight:

}


.time {

}


/******************************************************

/******************************************************

.footer {

/******************************************************

.error-box {

/******************************************************

@media (

  .brand-logo {

  }

  }

  }

  }

  }


  .camera-panel {

    min-height:

  }

  }


  .employee-photo-wrapper {

}


/******************************************************

@media (
  min-width: 1500px

      250px;

      250px;

  }

}

<main class="main">


  <!-- ================================================

  ================================================= -->

  <section class="camera-panel">

    <div class="camera-title">

    </div>

      >

      >

<script>

/******************************************************
 * CONFIG
 ******************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbwqrwaIkC2J1wa29IfnX3ZrQFoot62igkSgf2jGsx8cyFxLJHDeUpBIK2xg90487w/exec';


/******************************************************
 * GLOBALS
 ******************************************************/

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;


/******************************************************
 * ELEMENTS
 ******************************************************/

const waiting =
  document.getElementById(
    'waiting'
  );


const employeeCard =
  document.getElementById(
    'employeeCard'
  );


const employeePhoto =
  document.getElementById(
    'employeePhoto'
  );


const employeeName =
  document.getElementById(
    'employeeName'
  );


const employeeId =
  document.getElementById(
    'employeeId'
  );


const employeeAction =
  document.getElementById(
    'employeeAction'
  );


const employeeDate =
  document.getElementById(
    'employeeDate'
  );


const employeeTime =
  document.getElementById(
    'employeeTime'
  );


const successMessage =
  document.getElementById(
    'successMessage'
  );


const cameraStatus =
  document.getElementById(
    'cameraStatus'
  );


const errorBox =
  document.getElementById(
    'errorBox'
  );


/******************************************************
 * BEEP
 ******************************************************/

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      1000;


    gain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.25,
      audioContext.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + 0.18
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.2
    );


  } catch (error) {

    console.log(
      'Beep error:',
      error
    );

  }

}


/******************************************************
 * ERROR DISPLAY
 ******************************************************/

function showError(
  message
) {

  errorBox.textContent =
    message;


  errorBox.style.display =
    'block';


  setTimeout(
    function() {

      errorBox.style.display =
        'none';

    },
    4000
  );

}


/******************************************************
 * FORMAT DATE
 ******************************************************/

function formatDate(
  value
) {

  const date =
    value
      ? new Date(value)
      : new Date();


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return new Date()
      .toLocaleDateString(
        'en-PH',
        {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }
      );

  }


  return date.toLocaleDateString(
    'en-PH',
    {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    }
  );

}


/******************************************************
 * FORMAT TIME
 ******************************************************/

function formatTime(
  value
) {

  /*
   * The backend returns HH:mm:ss.
   * Display it directly so timezone conversion
   * will not accidentally change the attendance time.
   */

  if (
    value &&
    /^\d{2}:\d{2}:\d{2}$/.test(
      String(value)
    )
  ) {

    return value;

  }


  return new Date()
    .toLocaleTimeString(
      'en-PH',
      {
        hour:
          '2-digit',

        minute:
          '2-digit',

        second:
          '2-digit',

        hour12:
          true
      }
    );

}


/******************************************************
 * SHOW EMPLOYEE
 ******************************************************/

function showEmployee(
  data
) {

  waiting.style.display =
    'none';


  employeeCard.style.display =
    'flex';


  /*
   * NAME
   */

  employeeName.textContent =
    data.employeeName ||
    'EMPLOYEE';


  /*
   * ID
   */

  employeeId.textContent =
    'EMPLOYEE ID: ' +
    (
      data.employeeId ||
      ''
    );


  /*
   * ACTION
   */

  const action =
    String(
      data.action ||
      ''
    ).toUpperCase();


  employeeAction.textContent =
    action;


  employeeAction.classList.remove(
    'time-in',
    'time-out'
  );


  if (
    action === 'TIME OUT'
  ) {

    employeeAction.classList.add(
      'time-out'
    );

  } else {

    employeeAction.classList.add(
      'time-in'
    );

  }


  /*
   * DATE
   */

  employeeDate.textContent =
    formatDate();


  /*
   * TIME
   */

  employeeTime.textContent =
    formatTime(
      data.time
    );


  /*
   * MESSAGE
   */

  successMessage.textContent =
    data.message ||
    'Attendance recorded successfully.';


  /*
   * PHOTO
   */

  if (
    data.employeePhotoUrl
  ) {

    employeePhoto.src =
      data.employeePhotoUrl;


    employeePhoto.style.display =
      'block';


    employeePhoto.onerror =
      function() {

        this.style.display =
          'none';

      };

  } else {

    employeePhoto.removeAttribute(
      'src'
    );


    employeePhoto.style.display =
      'none';

  }

}


/******************************************************
 * API REQUEST
 ******************************************************/

async function sendScan(
  employeeIdValue
) {

  const url =

    API_URL +

    '?scan=QR&id=' +

    encodeURIComponent(
      employeeIdValue
    ) +

    '&_=' +

    Date.now();


  try {

    const response =
      await fetch(
        url,
        {
          method:
            'GET',

          cache:
            'no-store'
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        'Server returned HTTP ' +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      data.success
    ) {

      /*
       * SUCCESS BEEP
       */

      beep();


      /*
       * DISPLAY EMPLOYEE
       *
       * IMPORTANT:
       * No timeout.
       *
       * The employee stays visible
       * until another employee scans.
       */

      showEmployee(
        data
      );


      cameraStatus.textContent =
        'READY — SCAN NEXT EMPLOYEE';


    } else {

      showError(
        data.message ||
        'Unable to process scan.'
      );


      cameraStatus.textContent =
        'READY — SCAN NEXT EMPLOYEE';

    }


  } catch (error) {

    console.error(
      error
    );


    showError(
      'Unable to connect to attendance server.'
    );


    cameraStatus.textContent =
      'READY — SCAN NEXT EMPLOYEE';

  }

}


/******************************************************
 * QR SCAN SUCCESS
 ******************************************************/

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  /*
   * Prevent multiple callbacks from
   * the same QR while processing.
   */

  if (
    processingScan
  ) {

    return;

  }


  const scannedId =
    String(
      decodedText || ''
    ).trim();


  if (!scannedId) {

    return;

  }


  processingScan =
    true;


  cameraStatus.textContent =
    'PROCESSING SCAN...';


  try {

    await sendScan(
      scannedId
    );

  } finally {

    /*
     * Small cooldown prevents the same
     * QR from being recorded repeatedly
     * while it remains in front of camera.
     */

    setTimeout(
      function() {

        processingScan =
          false;


        cameraStatus.textContent =
          'READY — SCAN NEXT EMPLOYEE';

      },
      1800
    );

  }

}


/******************************************************
 * QR SCAN FAILURE
 ******************************************************/

function onScanFailure(
  errorMessage
) {

  /*
   * Ignore normal camera scanning misses.
   *
   * html5-qrcode calls this continuously
   * when no QR is detected.
   */

}


/******************************************************
 * START CAMERA
 ******************************************************/

async function startScanner() {

  cameraStatus.textContent =
    'Starting camera...';


  html5QrCode =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps:
      10,

    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const minDimension =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );


        const boxSize =
          Math.floor(
            minDimension * 0.72
          );


        return {

          width:
            boxSize,

          height:
            boxSize

        };

      },

    aspectRatio:
      1.0,

    rememberLastUsedCamera:
      true

  };


  try {

    await html5QrCode.start(

      {
        facingMode:
          'environment'
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerRunning =
      true;


    cameraStatus.textContent =
      'READY — SCAN NEXT EMPLOYEE';


  } catch (error) {

    console.error(
      error
    );


    cameraStatus.textContent =
      'CAMERA ERROR — PLEASE ALLOW CAMERA ACCESS';


    showError(
      'Please allow camera access and reload this page.'
    );

  }

}


/******************************************************
 * KEEP CAMERA RUNNING
 ******************************************************/

window.addEventListener(
  'visibilitychange',
  async function() {

    /*
     * Do not automatically clear
     * the employee display.
     *
     * If browser temporarily suspends
     * the camera, restart it when page
     * becomes visible again.
     */

    if (
      document.visibilityState ===
      'visible' &&
      !scannerRunning
    ) {

      try {

        await startScanner();

      } catch (error) {

        console.error(
          error
        );

      }

    }

  }
);


/******************************************************
 * INITIALIZE
 ******************************************************/

window.addEventListener(
  'load',
  function() {

    startScanner();

  }
);

</script>
